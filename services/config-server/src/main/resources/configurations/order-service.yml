server:
  port: 8070

spring:
  datasource:
    url:
      jdbc:postgresql://localhost:5432/order
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    placeholders:
      orderConfirmationTopic: ${ORDER_CONFIRMATION_TOPIC:order-topic}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

application:
  messaging:
    topics:
      ORDER_CONFIRMATION: ${ORDER_CONFIRMATION_TOPIC:order-topic}
    publish-timeout-ms: 10000
    outbox-poll-interval-ms: 500
    outbox-initial-delay-ms: 1000
    outbox-batch-size: 50
    topic-partitions: 1
    topic-replicas: 1
  config:
    customer-url: http://localhost:8222/api/v1/customers
    payment-url: http://localhost:8222/api/v1/payments
    product-url: http://localhost:8222/api/v1/products
