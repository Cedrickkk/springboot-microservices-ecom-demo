server:
  port: 8060

spring:
  datasource:
    url: ${PAYMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${PAYMENT_DATABASE_USERNAME:admin}
    password: ${PAYMENT_DATABASE_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

application:
  messaging:
    topics:
      PAYMENT_CONFIRMATION: ${PAYMENT_CONFIRMATION_TOPIC:payment-topic}
    publish-timeout-ms: 10000
    outbox-poll-interval-ms: 500
    outbox-initial-delay-ms: 1000
    outbox-batch-size: 50
    topic-partitions: 1
    topic-replicas: 1
